# toolpin runs its own rules over its own source on every push.
# Paths that legitimately contain attack samples are listed in .toolpinignore.
name: toolpin

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      # Dogfooding: the action resolves to the local build inside this repo,
      # so a pull request is scanned by the code it changes.
      - uses: ./
        with:
          fail-on: high

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Publishes the false-positive rate against real servers to the job summary.
      - run: |
          npm run benchmark | tee bench.txt
          { echo '## False-positive benchmark'; echo; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

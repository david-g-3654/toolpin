# Weekly rug-pull check.
#
# `toolpin pin` records what each server's tools claimed to do when they were
# reviewed. This workflow re-reads the current tool surface and fails if a
# description changed -- the one change that no version number reflects and no
# dependency scanner sees.
name: MCP drift

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # toolpin.lock is committed to the repo. Regenerate it deliberately,
      # after reviewing the change: `toolpin pin . && git add toolpin.lock`.
      - name: Check the pinned tool surface
        id: drift
        run: npx --yes toolpin@latest scan . --lock toolpin.lock --format markdown --fail-on critical

      - name: Open an issue when a description changed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'MCP tool surface changed since it was pinned',
              body: [
                'A tool description changed without a corresponding review.',
                '',
                `See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'If the change is expected, re-pin with `npx toolpin pin .` and commit `toolpin.lock`.',
              ].join('\n'),
              labels: ['security'],
            });
